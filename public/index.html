<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Subastas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .print-shadow-none { box-shadow: none !important; border: none !important; }
            /* Forzar colores claros en impresión para los contenedores */
            .print-reset-bg { background-color: white !important; color: black !important; border-color: #ccc !important; }
            .print-text-dark { color: black !important; }
        }
    </style>
</head>
<body class="bg-gray-850 text-gray-200 p-6">
    <div id="app" class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-white no-print flex items-center gap-2">
            🚗 Gestor de Subastas <span class="text-xs bg-blue-600 text-white px-2 py-1 rounded-full font-normal">Dark Edition</span>
        </h1>

        <!-- SELECCIÓN / CREACIÓN DE SUBASTA -->
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-lg shadow-xl mb-6 flex gap-4 items-end no-print">
            <div class="flex-1">
                <label class="block text-sm font-medium text-gray-300">Seleccionar Subasta Existente</label>
                <select v-model="subastaActiva" class="mt-1 block w-full bg-gray-800 border border-gray-700 text-white rounded-md p-2 focus:ring-2 focus:ring-blue-500">
                    <option :value="null">-- Crear Nueva Subasta --</option>
                    <option v-for="sub in subastas" :value="sub">{{ sub.nombre }}</option>
                </select>
            </div>
            <div class="flex-1" v-if="!subastaActiva">
                <label class="block text-sm font-medium text-gray-300">Nombre de Nueva Subasta</label>
                <input v-model="nuevaSubastaNombre" type="text" placeholder="Ej: Subasta Supervielle 10 de Agosto" class="mt-1 block w-full bg-gray-800 border border-gray-700 text-white rounded-md p-2">
            </div>
            <button v-if="!subastaActiva" @click="crearSubasta" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-500 font-semibold transition-colors">Crear y Entrar</button>
        </div>

        <!-- PANEL DE LA SUBASTA ACTIVA -->
        <div v-if="subastaActiva" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- FORMULARIO DE LOTE -->
            <div class="lg:col-span-1 bg-gray-900 border border-gray-800 p-6 rounded-lg shadow-xl h-fit no-print">
                <h2 class="text-xl font-semibold mb-4 text-blue-400">{{ modoEdicion ? 'Editar Lote' : 'Agregar Nuevo Lote' }}</h2>
                <form @submit.prevent="guardarLote" class="space-y-4 text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-gray-400">Nº Lote</label>
                            <input v-model="form.numero" type="text" required class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                        <div>
                            <label class="text-gray-400">Año</label>
                            <input v-model.number="form.anio" type="number" required class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-gray-400">Marca</label>
                            <input v-model="form.marca" type="text" required class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                        <div>
                            <label class="text-gray-400">Modelo</label>
                            <input v-model="form.modelo" type="text" required class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                    </div>

                    <div>
                        <label class="text-gray-400">Versión</label>
                        <input v-model="form.version" type="text" required class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-gray-400">Transmisión</label>
                            <select v-model="form.transmision" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                                <option value="Manual">Manual</option>
                                <option value="Automático">Automático</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-gray-400">Deuda Infracc. ($)</label>
                            <input v-model.number="form.deudaInfracciones" type="number" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-gray-400">Deuda Patentes ($)</label>
                            <input v-model.number="form.deudaPatentes" type="number" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                        <div>
                            <label class="text-gray-400">Costo Reparación ($)</label>
                            <input v-model.number="form.costoReparacion" type="number" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="text-gray-400">Val. Mínimo</label>
                            <input v-model.number="form.valorMin" type="number" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                        <div>
                            <label class="text-gray-400">Val. Máximo</label>
                            <input v-model.number="form.valorMax" type="number" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                        <div>
                            <label class="text-gray-400">P. Venta Est.</label>
                            <input v-model.number="form.precioVenta" type="number" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                        </div>
                    </div>

                    <div>
                        <label class="text-gray-400">Obs. Valor Mínimo / Estado</label>
                        <input v-model="form.obsMin" type="text" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded">
                    </div>

                    <div>
                        <label class="text-gray-400">Daños</label>
                        <textarea v-model="form.daños" class="w-full bg-gray-800 border border-gray-700 text-white p-1.5 rounded" rows="2"></textarea>
                    </div>

                    <div class="bg-blue-950/60 border border-blue-800/80 p-3 rounded-md">
                        <label class="font-bold text-blue-300 block mb-1">Precio Final Objetivo ($)</label>
                        <input v-model.number="form.precioObjetivo" type="number" required class="w-full bg-gray-900 border border-blue-600 text-white p-2 rounded text-lg font-bold">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 text-white px-4 py-2 rounded-md hover:bg-emerald-500 font-bold transition-colors">
                        {{ modoEdicion ? 'Actualizar Lote' : 'Guardar Lote' }}
                    </button>
                    <button type="button" v-if="modoEdicion" @click="cancelarEdicion" class="w-full mt-2 bg-gray-700 text-gray-200 px-4 py-2 rounded-md hover:bg-gray-600">Cancelar</button>
                </form>
            </div>

            <!-- LISTA DE LOTES Y CÁLCULOS -->
            <div class="lg:col-span-2 bg-gray-900 border border-gray-800 p-6 rounded-lg shadow-xl overflow-x-auto print-shadow-none print-reset-bg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-100 print-text-dark">Lotes en {{ subastaActiva.nombre }}</h2>
                    <button @click="imprimirResumen" class="bg-gray-800 border border-gray-700 text-gray-200 px-4 py-2 rounded-md hover:bg-gray-700 text-sm flex items-center gap-2 no-print transition-colors">
                        🖨️ Imprimir Resumen / PDF
                    </button>
                </div>

                <div v-if="subastaActiva.lotes && subastaActiva.lotes.length === 0" class="text-gray-500">No hay lotes cargados.</div>
                
                <table v-else class="min-w-full text-sm text-left">
                    <thead class="bg-gray-800 text-gray-300 print-reset-bg">
                        <tr>
                            <th class="p-2">Lote</th>
                            <th class="p-2">Vehículo</th>
                            <th class="p-2">P. Objetivo</th>
                            <th class="p-2 bg-amber-950/60 text-amber-300 font-bold print-reset-bg">MÁX. MARTILLO</th>
                            <th class="p-2 bg-emerald-950/60 text-emerald-300 print-reset-bg">Ganancia Est.</th>
                            <th class="p-2 no-print">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template v-for="(lote, index) in subastaActiva.lotes" :key="index">
                            <tr class="border-b border-gray-800 hover:bg-gray-800/50">
                                <td class="p-2 font-bold text-white print-text-dark">{{ lote.numero }}</td>
                                <td class="p-2 text-gray-200 print-text-dark">{{ lote.marca }} {{ lote.modelo }} <span class="text-xs text-gray-400">({{ lote.anio }} - {{ lote.transmision }})</span></td>
                                <td class="p-2 text-gray-200 print-text-dark">${{ lote.precioObjetivo?.toLocaleString() }}</td>
                                <td class="p-2 bg-amber-950/30 font-bold text-base text-amber-400 print-reset-bg">${{ calcularMartillo(lote).toLocaleString(undefined, {maximumFractionDigits: 0}) }}</td>
                                <td class="p-2 bg-emerald-950/30 text-emerald-400 font-bold print-reset-bg">${{ calcularGanancia(lote).toLocaleString() }}</td>
                                <td class="p-2 flex gap-2 no-print">
                                    <button @click="editarLote(lote, index)" class="text-blue-400 hover:underline">Editar</button>
                                    <button @click="eliminarLote(index)" class="text-red-400 hover:underline">Borrar</button>
                                    <button @click="toggleDesglose(index)" class="text-purple-400 hover:underline font-semibold">
                                        {{ loteExpandido === index ? 'Ocultar' : 'Desglose' }}
                                    </button>
                                </td>
                            </tr>
                            <!-- FILA DE DESGLOSE EXPANDIBLE -->
                            <tr v-if="loteExpandido === index" class="bg-gray-950 border-b border-gray-800">
                                <td colspan="6" class="p-4">
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs bg-gray-900 border border-gray-800 p-4 rounded shadow-inner text-gray-300">
                                        <div>
                                            <p class="font-bold text-blue-400 mb-1">📋 Mercado y Estado</p>
                                            <p><strong>Val. Mínimo:</strong> ${{ lote.valorMin?.toLocaleString() }}</p>
                                            <p><strong>Val. Máximo:</strong> ${{ lote.valorMax?.toLocaleString() }}</p>
                                            <p><strong>Obs. Mín:</strong> {{ lote.obsMin || 'N/D' }}</p>
                                            <p><strong>Daños:</strong> {{ lote.daños || 'Ninguno' }}</p>
                                        </div>
                                        <div>
                                            <p class="font-bold text-amber-400 mb-1">🛠️ Gastos Fijos & Deudas</p>
                                            <p><strong>Deuda Infracciones:</strong> ${{ lote.deudaInfracciones?.toLocaleString() }}</p>
                                            <p><strong>Deuda Patentes:</strong> ${{ lote.deudaPatentes?.toLocaleString() }}</p>
                                            <p><strong>Costo Reparación:</strong> ${{ lote.costoReparacion?.toLocaleString() }}</p>
                                            <p><strong>Formularios (Fijo):</strong> $72.600</p>
                                            <p><strong>Gestoría (+IVA):</strong> $72.600</p>
                                            <p><strong>Verificación Policial (+IVA):</strong> $212.318,70</p>
                                            <p><strong>Grabado Autopartes (+IVA):</strong> $184.549,20</p>
                                        </div>
                                        <div>
                                            <p class="font-bold text-emerald-400 mb-1">📊 Desglose del Martillo</p>
                                            <p class="text-sm font-bold text-amber-300">Valor Martillo Máx: ${{ calcularMartillo(lote).toLocaleString(undefined, {maximumFractionDigits: 0}) }}</p>
                                            <hr class="my-1 border-gray-700">
                                            <p><strong>Comisión (10%+IVA):</strong> ${{ (calcularMartillo(lote) * 0.121).toLocaleString(undefined, {maximumFractionDigits: 0}) }}</p>
                                            <p><strong>Gastos Adm. (2.5%+IVA):</strong> ${{ (calcularMartillo(lote) * 0.03025).toLocaleString(undefined, {maximumFractionDigits: 0}) }}</p>
                                            <p><strong>Transferencia (3%):</strong> ${{ (calcularMartillo(lote) * 0.03).toLocaleString(undefined, {maximumFractionDigits: 0}) }}</p>
                                            <p class="mt-2 text-emerald-400 font-bold"><strong>Ganancia Estimada Venta:</strong> ${{ calcularGanancia(lote).toLocaleString() }}</p>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    subastas: [],
                    subastaActiva: null,
                    nuevaSubastaNombre: '',
                    modoEdicion: false,
                    indiceEdicion: -1,
                    loteExpandido: null,
                    form: this.getFormularioVacio()
                }
            },
            mounted() {
                this.cargarSubastas();
            },
            methods: {
                getFormularioVacio() {
                    return {
                        numero: '', marca: '', modelo: '', version: '', transmision: 'Manual', anio: null,
                        deudaInfracciones: 0, deudaPatentes: 0, costoReparacion: 0,
                        precioVenta: 0, precioObjetivo: 0, daños: '', valorMin: 0, valorMax: 0, obsMin: ''
                    }
                },
                async cargarSubastas() {
                    try {
                        const res = await fetch('/.netlify/functions/auctions');
                        if (res.ok) {
                            const data = await res.json();
                            this.subastas = data;
                            if (this.subastaActiva) {
                                this.subastaActiva = this.subastas.find(s => s.id === this.subastaActiva.id) || null;
                            }
                        }
                    } catch (e) {
                        console.error("Error cargando subastas:", e);
                    }
                },
                async guardarEnBD() {
                    const res = await fetch('/.netlify/functions/auctions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.subastaActiva)
                    });
                    if (res.ok) {
                        await this.cargarSubastas();
                    }
                },
                async crearSubasta() {
                    if (!this.nuevaSubastaNombre) return;
                    const nueva = { nombre: this.nuevaSubastaNombre, lotes: [] };
                    const res = await fetch('/.netlify/functions/auctions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(nueva)
                    });
                    const data = await res.json();
                    nueva.id = data.id;
                    this.subastas.push(nueva);
                    this.subastaActiva = nueva;
                    this.nuevaSubastaNombre = '';
                },
                guardarLote() {
                    if (this.modoEdicion) {
                        this.subastaActiva.lotes[this.indiceEdicion] = { ...this.form };
                    } else {
                        if(!this.subastaActiva.lotes) this.subastaActiva.lotes = [];
                        this.subastaActiva.lotes.push({ ...this.form });
                    }
                    this.guardarEnBD();
                    this.cancelarEdicion();
                },
                editarLote(lote, index) {
                    this.form = { ...lote };
                    this.modoEdicion = true;
                    this.indiceEdicion = index;
                },
                eliminarLote(index) {
                    if (confirm("¿Borrar este lote?")) {
                        this.subastaActiva.lotes.splice(index, 1);
                        this.guardarEnBD();
                    }
                },
                cancelarEdicion() {
                    this.form = this.getFormularioVacio();
                    this.modoEdicion = false;
                    this.indiceEdicion = -1;
                },
                toggleDesglose(index) {
                    this.loteExpandido = this.loteExpandido === index ? null : index;
                },
                imprimirResumen() {
                    window.print();
                },
                calcularMartillo(lote) {
                    const deudas = (lote.deudaInfracciones || 0) + (lote.deudaPatentes || 0);
                    const reparaciones = lote.costoReparacion || 0;
                    
                    const gestoria = 60000 * 1.21;
                    const verifPolicial = 175470 * 1.21;
                    const grabado = 152520 * 1.21;
                    const formularios = 72600;
                    const totalFijos = gestoria + verifPolicial + grabado + formularios;
                    
                    const costoExtra = totalFijos + deudas + reparaciones;
                    
                    const comision = 0.10 * 1.21;
                    const gastosAdm = 0.025 * 1.21;
                    const transferencia = 0.03;
                    const multiplicadorVariable = 1 + comision + gastosAdm + transferencia;

                    const martillo = ((lote.precioObjetivo || 0) - costoExtra) / multiplicadorVariable;
                    return martillo > 0 ? martillo : 0;
                },
                calcularGanancia(lote) {
                    const venta = lote.precioVenta || 0;
                    const objetivo = lote.precioObjetivo || 0;
                    return venta - objetivo;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
